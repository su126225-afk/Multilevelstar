<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Mock Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}
.wrap{max-width:900px;margin:0 auto;padding:36px 20px 60px}
h1{font-weight:400;color:#e4002b;font-size:28px;margin:0 0 26px}
.day{display:flex;align-items:center;gap:16px;font-weight:700;color:#555;font-size:14px;margin-bottom:26px}.day i{flex:1;height:1px;background:#555}
.card{border:1px solid #777;border-radius:4px;padding:28px 30px;margin-bottom:24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card h2{margin:0 0 14px;font-size:20px;color:#444}
.st{font-weight:700;font-size:16px;margin-bottom:14px}.st.no{color:#e4002b}.st.ok{color:#a4bf3a}.st.lock{color:#888}
.meta{font-size:13px;color:#444}.score{font-size:13px;color:#444;margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:4px;padding:11px 20px;background:#2a6c96;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn[aria-disabled=true]{background:#9a9a9a;cursor:not-allowed;pointer-events:none}
.tick{width:54px;height:54px;color:#a4bf3a}
.done{border:1px solid #a4bf3a;background:#f7faea;border-radius:4px;padding:22px 26px;margin-bottom:24px}
.done h2{margin:0 0 8px;color:#5b7a10;font-size:20px}
.foot{margin-top:30px;font-size:12.5px;color:#777;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;color:#2a6c96;cursor:pointer;font:inherit;text-decoration:underline;padding:0}
</style>
</head>
<body><div class="wrap">
<h1>IELTS Mock Test</h1><div class="day">Today<i></i></div>
<div id="list"></div><div id="final"></div>
<div class="foot"><span>English with Usmonov</span><button class="link" id="reset">Start the mock again</button></div>
</div>
<script>
var TESTS=[1,2];
var NQ=parseInt((location.search.match(/[?&]test=(\d+)/)||[0,0])[1],10)||0;
var N=NQ||1;
function sections(n){return [
  {key:'listening',title:'Listening',timing:'30 minutes',file:'cdi-listening-'+n+'.html',label:'Start Listening'},
  {key:'reading',title:'Reading',timing:'60 minutes',file:'cdi-reading-'+n+'.html',label:'Start Reading'},
  {key:'writing',title:'Writing',timing:'60 minutes',file:'cdi-writing-'+n+'.html',label:'Start Writing'}];}
var SECTIONS=sections(N);
var KEY=N===1?'ielts_mock_v1':'ielts_mock_v1_t'+N;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
var TICK='<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
function exists(f){return fetch(f,{method:'HEAD'}).then(function(r){return r.ok;}).catch(function(){return false;});}
function loadKey(k){try{return JSON.parse(localStorage.getItem(k))||{};}catch(e){return {};}}
var stu=null;try{stu=JSON.parse(localStorage.getItem('ma_student'));}catch(e){}
if(stu&&!stu.name)stu=null;
if(!NQ){
  document.querySelector('h1').textContent='IELTS Mock Test';
  var h='';
  TESTS.forEach(function(n){var st=loadKey(n===1?'ielts_mock_v1':'ielts_mock_v1_t'+n),c=['listening','reading','writing'].filter(function(k){return st[k]&&st[k].done;}).length;
    h+='<div class="card"><div><h2>Test '+n+'</h2><div class="st '+(c===3?'ok':'no')+'">'+(c===3?'Completed':c?c+' of 3 sections completed':'Not started')+'</div><div class="meta">Listening · Reading · Writing</div></div><div><a class="btn" href="?test='+n+'">'+(c===3?'Open':c?'Continue':'Open')+'</a></div></div>';});
  document.getElementById('list').innerHTML=h;
}else
Promise.all(SECTIONS.map(function(s){return exists(s.file);})).then(function(ok){
  var st=loadKey(KEY),html='',prevDone=true;
  if(!stu){document.getElementById('list').innerHTML='<div class="card"><div><h2>Please sign in first</h2><div class="meta">Enter your name and group code on the main page, then come back to the mock test.</div></div><div><a class="btn" href="./#/ielts">Sign in</a></div></div>';return;}
  html+='<div class="meta" style="margin-bottom:6px"><a class="link" href="ielts-mock.html">&larr; All tests</a></div><div class="meta" style="margin-bottom:18px"><b>Test '+N+'</b> &nbsp;·&nbsp; Student: <b>'+String(stu.name).replace(/</g,'&lt;')+'</b>'+(stu.group?' · Group: <b>'+String(stu.group).replace(/</g,'&lt;')+'</b>':'')+'</div>';
  SECTIONS.forEach(function(s,i){
    var d=st[s.key]&&st[s.key].done,avail=ok[i],locked=!prevDone;
    var status=d?'<div class="st ok">Completed</div>':locked?'<div class="st lock">Locked — finish the previous section first</div>':avail?'<div class="st no">Not completed</div>':'<div class="st lock">Coming soon</div>';
    var act=d?TICK:'<a class="btn" data-k="'+s.key+'" href="'+s.file+'?mock=1" '+((locked||!avail)?'aria-disabled="true"':'')+'>'+s.label+'</a>';
    html+='<div class="card"><div><h2>'+s.title+'</h2>'+status+'<div class="meta">Timing: '+s.timing+'</div></div><div>'+act+'</div></div>';
    prevDone=prevDone&&!!d;
  });
  document.getElementById('list').innerHTML=html;
  var all=SECTIONS.every(function(s){return st[s.key]&&st[s.key].done;});
  if(all)document.getElementById('final').innerHTML='<div class="done"><h2>Mock finished</h2>Your answers have been sent to your teacher. Your results will be given to you by your teacher.</div>';
  var first=document.querySelector('a.btn[data-k="listening"]');
  if(first)first.addEventListener('click',function(){if(window.MockSync)MockSync.newAttempt();});
  if(window.MockSync)MockSync.flush();
});
document.getElementById('reset').onclick=function(){if(confirm('Start the mock again from Listening? Your previous answers stay with your teacher.')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};
</script><script src="mock-sync.js"></script></body></html>
