<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Mock Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}
.wrap{max-width:900px;margin:0 auto;padding:36px 20px 60px}
h1{font-weight:400;color:#e4002b;font-size:28px;margin:0 0 26px}
.day{display:flex;align-items:center;gap:16px;font-weight:700;color:#555;font-size:14px;margin-bottom:26px}.day i{flex:1;height:1px;background:#555}
.card{border:1px solid #777;border-radius:4px;padding:28px 30px;margin-bottom:24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card h2{margin:0 0 14px;font-size:20px;color:#444}
.st{font-weight:700;font-size:16px;margin-bottom:14px}.st.no{color:#e4002b}.st.ok{color:#a4bf3a}.st.lock{color:#888}
.meta{font-size:13px;color:#444}.score{font-size:13px;color:#444;margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:4px;padding:11px 20px;background:#2a6c96;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn[aria-disabled=true]{background:#9a9a9a;cursor:not-allowed;pointer-events:none}
.tick{width:54px;height:54px;color:#a4bf3a}
.done{border:1px solid #a4bf3a;background:#f7faea;border-radius:4px;padding:22px 26px;margin-bottom:24px}
.done h2{margin:0 0 8px;color:#5b7a10;font-size:20px}
.foot{margin-top:30px;font-size:12.5px;color:#777;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;color:#2a6c96;cursor:pointer;font:inherit;text-decoration:underline;padding:0}
</style>
</head>
<body><div class="wrap">
<h1>IELTS Mock Test</h1><div class="day">Today<i></i></div>
<div id="list"></div><div id="final"></div>
<div class="foot"><span>English with Usmonov</span><button class="link" id="reset">Start the mock again</button></div>
</div>
<script>
// Edit this list to add sections (the Writing page can be added the same way).
var SECTIONS=[
  {key:'listening',title:'Listening',timing:'30 minutes',file:'cdi-listening-1.html',label:'Start Listening'},
  {key:'reading',title:'Reading',timing:'60 minutes',file:'cdi-reading-1.html',label:'Start Reading'},
  {key:'writing',title:'Writing',timing:'60 minutes',file:'cdi-writing-1.html',label:'Start Writing'}
];
var KEY='ielts_mock_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
var TICK='<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
function exists(f){return fetch(f,{method:'HEAD'}).then(function(r){return r.ok;}).catch(function(){return false;});}
Promise.all(SECTIONS.map(function(s){return exists(s.file);})).then(function(ok){
  var st=load(),html='',prevDone=true;
  SECTIONS.forEach(function(s,i){
    var d=st[s.key]&&st[s.key].done,avail=ok[i],locked=!prevDone;
    var status=d?'<div class="st ok">Completed</div>':locked?'<div class="st lock">Locked — finish the previous section first</div>':avail?'<div class="st no">Not completed</div>':'<div class="st lock">Coming soon</div>';
    var score=d&&st[s.key].band?'<div class="score">Estimated band: <b>'+st[s.key].band+'</b>'+(st[s.key].acc?' · Accuracy: '+st[s.key].acc:'')+'</div>':'';
    var act=d?TICK:'<a class="btn" href="'+s.file+'?mock=1" '+((locked||!avail)?'aria-disabled="true"':'')+'>'+s.label+'</a>';
    html+='<div class="card"><div><h2>'+s.title+'</h2>'+status+'<div class="meta">Timing: '+s.timing+'</div>'+score+'</div><div>'+act+'</div></div>';
    prevDone=prevDone&&!!d;
  });
  document.getElementById('list').innerHTML=html;
  var all=SECTIONS.every(function(s){return st[s.key]&&st[s.key].done;});
  if(all){var bands=SECTIONS.map(function(s){return parseFloat(st[s.key].band);}).filter(function(b){return !isNaN(b);});
    var avg=bands.length?Math.round(bands.reduce(function(a,b){return a+b;},0)/bands.length*2)/2:null;
    document.getElementById('final').innerHTML='<div class="done"><h2>Mock finished</h2>'+SECTIONS.map(function(s){return s.title+': <b>'+(st[s.key].band||'—')+'</b>';}).join(' &nbsp;·&nbsp; ')+(avg!==null?'<br><br>Average band of the sections above: <b>'+avg.toFixed(1)+'</b>':'')+'</div>';}
});
document.getElementById('reset').onclick=function(){if(confirm('Clear the results of this mock and start again?')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};
</script></body></html>
